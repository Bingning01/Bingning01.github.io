<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">稀缺性与资源配置</title>
  <desc id="desc">有限资源和无限欲望形成稀缺性，推动选择、机会成本和资源配置。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#52616b"/>
    </marker>
    <style>
      .card { fill: #f8fafc; stroke: #d7dee8; stroke-width: 2; rx: 14; }
      .accent-a { fill: #e8f3ff; stroke: #74a7d8; }
      .accent-b { fill: #fff4e6; stroke: #dda65f; }
      .accent-c { fill: #ecf8ef; stroke: #72b37b; }
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2933; }
      .label { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2933; }
      .small { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616b; }
      .arrow { stroke: #52616b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="920" height="360" fill="#ffffff"/>
  <text x="460" y="44" text-anchor="middle" class="title">经济学从“稀缺性”开始</text>

  <rect x="52" y="92" width="210" height="118" class="card accent-a"/>
  <text x="157" y="138" text-anchor="middle" class="label">有限资源</text>
  <text x="157" y="172" text-anchor="middle" class="small">土地、劳动、资本、时间</text>

  <rect x="52" y="228" width="210" height="76" class="card accent-b"/>
  <text x="157" y="260" text-anchor="middle" class="label">无限欲望</text>
  <text x="157" y="286" text-anchor="middle" class="small">需求总是超过可得资源</text>

  <path d="M282 150 H378" class="arrow"/>
  <path d="M282 266 H378" class="arrow"/>

  <rect x="392" y="128" width="166" height="120" class="card"/>
  <text x="475" y="178" text-anchor="middle" class="label">稀缺性</text>
  <text x="475" y="210" text-anchor="middle" class="small">必须做出取舍</text>

  <path d="M574 188 H660" class="arrow"/>

  <rect x="680" y="92" width="190" height="88" class="card accent-c"/>
  <text x="775" y="128" text-anchor="middle" class="label">选择</text>
  <text x="775" y="154" text-anchor="middle" class="small">优先满足更重要目标</text>

  <rect x="680" y="218" width="190" height="88" class="card accent-c"/>
  <text x="775" y="254" text-anchor="middle" class="label">机会成本</text>
  <text x="775" y="280" text-anchor="middle" class="small">放弃的最好替代用途</text>

  <path d="M775 180 V210" class="arrow"/>
</svg>
